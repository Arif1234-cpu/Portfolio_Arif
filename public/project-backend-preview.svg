<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <rect width="600" height="340" rx="12" fill="#0C0E14" />
  <rect x="1" y="1" width="598" height="338" rx="11" stroke="#222838" stroke-width="1.5" />

  <!-- Terminal top bar -->
  <rect x="0" y="0" width="600" height="38" rx="12" fill="#141722" />
  <rect x="0" y="28" width="600" height="10" fill="#141722" />
  <line x1="0" y1="38" x2="600" y2="38" stroke="#222838" stroke-width="1" />
  
  <circle cx="24" cy="19" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="42" cy="19" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="60" cy="19" r="5" fill="#10B981" opacity="0.8"/>
  <text x="300" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7E879B">api.service // routes &amp; controllers</text>

  <!-- Endpoint cards representation -->
  <g transform="translate(36, 58)">
    <!-- Route 1: GET /api/v1/health -->
    <rect x="0" y="0" width="528" height="48" rx="8" fill="#141722" stroke="#242B3D" stroke-width="1"/>
    <rect x="14" y="14" width="46" height="20" rx="4" fill="#065F46"/>
    <text x="37" y="28" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34D399">GET</text>
    <text x="74" y="29" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">/api/v1/health</text>
    <text x="490" y="29" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">200 OK · 4ms</text>

    <!-- Route 2: POST /api/v1/auth/login -->
    <rect x="0" y="58" width="528" height="48" rx="8" fill="#141722" stroke="#242B3D" stroke-width="1"/>
    <rect x="14" y="72" width="46" height="20" rx="4" fill="#1E3A8A"/>
    <text x="37" y="86" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60A5FA">POST</text>
    <text x="74" y="87" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">/api/v1/auth/tokens</text>
    <text x="490" y="87" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#818CF8">201 Created · JWT</text>

    <!-- Route 3: GET /api/v1/resources -->
    <rect x="0" y="116" width="528" height="48" rx="8" fill="#141722" stroke="#242B3D" stroke-width="1"/>
    <rect x="14" y="130" width="46" height="20" rx="4" fill="#065F46"/>
    <text x="37" y="144" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34D399">GET</text>
    <text x="74" y="145" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">/api/v1/tasks?status=active</text>
    <text x="490" y="145" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">200 OK · Indexed</text>

    <!-- Route 4: SQL Query preview -->
    <rect x="0" y="174" width="528" height="74" rx="8" fill="#0F121A" stroke="#202636" stroke-width="1"/>
    <text x="16" y="198" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF">-- Parameterized query with connection pool</text>
    <text x="16" y="220" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C084FC">SELECT <tspan fill="#E2E8F0">t.id, t.title, u.email</tspan> FROM <tspan fill="#818CF8">tasks t</tspan> JOIN <tspan fill="#818CF8">users u</tspan> ON <tspan fill="#E2E8F0">t.user_id = u.id;</tspan></text>
  </g>
</svg>
