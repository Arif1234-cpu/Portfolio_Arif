<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <rect width="600" height="340" rx="12" fill="#0C0E14" />
  <rect x="1" y="1" width="598" height="338" rx="11" stroke="#222838" stroke-width="1.5" />
  
  <!-- Browser top bar -->
  <rect x="0" y="0" width="600" height="40" rx="12" fill="#141722" />
  <rect x="0" y="30" width="600" height="10" fill="#141722" />
  <line x1="0" y1="40" x2="600" y2="40" stroke="#222838" stroke-width="1" />
  
  <circle cx="24" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="42" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="60" cy="20" r="5" fill="#10B981" opacity="0.8"/>

  <rect x="140" y="11" width="320" height="18" rx="9" fill="#1A1E2C" stroke="#283044" stroke-width="1"/>
  <text x="300" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E879B">portfolio.mark.dev</text>

  <!-- Content representation -->
  <g transform="translate(40, 70)">
    <!-- Brand wordmark representation -->
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#818CF8" letter-spacing="3">M A R K</text>
    <rect x="0" y="44" width="220" height="12" rx="6" fill="#818CF8" opacity="0.4"/>
    <rect x="0" y="66" width="280" height="10" rx="5" fill="#3A4259"/>
    <rect x="0" y="86" width="240" height="10" rx="5" fill="#3A4259"/>

    <rect x="0" y="120" width="100" height="32" rx="8" fill="#6366F1"/>
    <rect x="115" y="120" width="100" height="32" rx="8" fill="#1E2332" stroke="#374151" stroke-width="1"/>
    
    <!-- Code preview box on right -->
    <rect x="320" y="0" width="200" height="200" rx="10" fill="#131622" stroke="#2D3448" stroke-width="1"/>
    <text x="336" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C084FC">&lt;Portfolio /&gt;</text>
    <line x1="336" y1="46" x2="504" y2="46" stroke="#222838" stroke-width="1"/>
    
    <text x="336" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6B7280">const mark = {</text>
    <text x="350" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">  name: 'Arif',</text>
    <text x="350" y="110" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">  cpi: 8.94,</text>
    <text x="350" y="130" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">  focus: 'Backend'</text>
    <text x="336" y="150" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6B7280">};</text>
  </g>
</svg>
