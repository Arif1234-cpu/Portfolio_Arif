    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6B7280">// Graph BFS with adjacency list</text>
    <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C084FC">void <tspan fill="#60A5FA">bfs</tspan>(<tspan fill="#F59E0B">int</tspan> startNode) {</text>
    <text x="28" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">  std::queue&lt;int&gt; q;</text>
    <text x="28" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">  visited[startNode] = true;</text>
    <text x="28" y="108" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">  q.push(startNode);</text>
    <text x="28" y="132" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C084FC">  while (!q.empty()) {</text>
    <text x="40" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">    int curr = q.front(); q.pop();</text>
    <text x="40" y="172" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">    for (int next : adj[curr]) {</text>
    <text x="52" y="192" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6B7280">      // O(V + E) complexity</text>
    <text x="40" y="210" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C084FC">    }</text>
    <text x="28" y="226" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C084FC">  }</text>
  </g>

