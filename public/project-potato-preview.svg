<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <rect width="600" height="340" rx="12" fill="#0C0E14" />
  <rect x="1" y="1" width="598" height="338" rx="11" stroke="#222838" stroke-width="1.5" />
  
  <!-- Browser top bar -->
  <rect x="0" y="0" width="600" height="38" rx="12" fill="#141722" />
  <rect x="0" y="28" width="600" height="10" fill="#141722" />
  <line x1="0" y1="38" x2="600" y2="38" stroke="#222838" stroke-width="1" />
  
  <circle cx="24" cy="19" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="42" cy="19" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="60" cy="19" r="5" fill="#10B981" opacity="0.8"/>
  <rect x="160" y="10" width="280" height="18" rx="9" fill="#1A1E2C" stroke="#283044" stroke-width="1"/>
  <text x="300" y="23" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E879B">streamlit.app/potato-disease-cnn</text>

  <!-- Left: CNN Leaf Classification Graphic -->
  <g transform="translate(35, 60)">
    <rect x="0" y="0" width="230" height="235" rx="10" fill="#121622" stroke="#242B3D" stroke-width="1"/>
    
    <!-- Stylized Leaf -->
    <path d="M115 45 C75 75, 60 135, 115 175 C170 135, 155 75, 115 45 Z" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <path d="M115 55 L115 165" stroke="#34D399" stroke-width="1.5" stroke-dasharray="2 2"/>
    <path d="M115 95 Q90 105, 80 120" stroke="#34D399" stroke-width="1.2"/>
    <path d="M115 125 Q140 135, 150 150" stroke="#34D399" stroke-width="1.2"/>
    
    <!-- Detection Points -->
    <circle cx="95" cy="115" r="4" fill="#F59E0B"/>
    <circle cx="130" cy="130" r="4" fill="#F59E0B"/>
    
    <rect x="25" y="190" width="180" height="28" rx="6" fill="#192030"/>
    <text x="115" y="208" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34D399">Potato Early Blight Detected</text>
  </g>

  <!-- Right: Model Architecture & Metrics -->
  <g transform="translate(290, 60)">
    <!-- Metric 1: Accuracy -->
    <rect x="0" y="0" width="275" height="65" rx="8" fill="#121622" stroke="#242B3D" stroke-width="1"/>
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E879B">TEST ACCURACY &amp; F1-SCORE</text>
    <text x="16" y="50" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#34D399">98.44%</text>
    <text x="145" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF">(256 evaluation images)</text>

    <!-- Metric 2: Architecture Layers -->
    <rect x="0" y="77" width="275" height="74" rx="8" fill="#121622" stroke="#242B3D" stroke-width="1"/>
    <text x="16" y="98" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E879B">CNN ARCHITECTURE (40 EPOCHS)</text>
    <text x="16" y="118" font-family="'JetBrains Mono', monospace" font-size="11" fill="#818CF8">Input: 256×256×3 (Normalized)</text>
    <text x="16" y="136" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C084FC">Conv2D → MaxPooling2D → Dense</text>

    <!-- Metric 3: Deployment -->
    <rect x="0" y="162" width="275" height="73" rx="8" fill="#121622" stroke="#242B3D" stroke-width="1"/>
    <text x="16" y="184" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E879B">DEPLOYMENT ENVIRONMENT</text>
    <text x="16" y="206" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0">Streamlit Web Interface</text>
    <text x="16" y="224" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">● Real-time prediction active</text>
  </g>
</svg>
